services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - deploy/.env
    environment:
      BOTEN_DATABASE_PATH: /data/boten.db
      BOTEN_UPLOAD_DIR: /data/uploads/catalog
    volumes:
      - ${BOTEN_DATA_DIR:-./data}:/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # LAN-only verification. Do not create a router port-forward for 8080.
      # When HTTPS reverse proxy is configured later, change this back to
      # 127.0.0.1:8080:80 and point the proxy to that local address.
      - "8080:80"
